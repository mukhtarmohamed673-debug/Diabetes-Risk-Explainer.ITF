# Look of the Diabetes Risk Explainer.
# Palette "three stones" (stone neutrals, one sage accent); type IBM Plex Sans and IBM Plex Mono.

[client]
toolbarMode = "minimal"
showErrorDetails = false

[ui]
hideTopBar = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#5c6b54"
backgroundColor = "#eeecea"
secondaryBackgroundColor = "#e4e1dd"
textColor = "#333231"
linkColor = "#333231"
linkUnderline = true
borderColor = "#d6d2cd"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "8px"
baseFontSize = 16
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
chartCategoricalColors = ["#9a4a2e", "#3b5870", "#5c6b54", "#8a6a1c"]
