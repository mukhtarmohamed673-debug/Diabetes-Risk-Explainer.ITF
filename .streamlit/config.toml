# Look of the Diabetes Risk Explainer.
# Deep navy structure, turquoise controls, emerald for good outcomes, warm coral for raised risk.
# Type: Plus Jakarta Sans.

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#14b8b0"
backgroundColor = "#f2f5f9"
secondaryBackgroundColor = "#e8edf4"
textColor = "#0b1f3a"
linkColor = "#0b7f86"
linkUnderline = true
borderColor = "#d5dde8"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "10px"
baseFontSize = 16
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
headingFont = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 700, 700, 700]
codeFont = "monospace"
greenColor = "#12a170"
redColor = "#ec5741"
blueColor = "#0b7f86"

[theme.sidebar]
backgroundColor = "#0b1f3a"
secondaryBackgroundColor = "#13305a"
textColor = "#ffffff"
primaryColor = "#14b8b0"
borderColor = "#2a4672"
linkColor = "#7fe3dc"
